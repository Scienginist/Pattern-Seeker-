name: CatalystFlow Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - "CatalystFlow/**"
      - ".github/workflows/catalystflow-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CatalystFlow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Business-rule tests (Windows)
        run: python -m pytest -q
      - name: Build exe
        run: pyinstaller packaging/CatalystFlow.spec --noconfirm
      - name: Smoke test packaged app (server only)
        shell: pwsh
        run: |
          $env:CATALYSTFLOW_DATA = "$env:RUNNER_TEMP\cfdata"
          $p = Start-Process -FilePath dist\CatalystFlow\CatalystFlow.exe -ArgumentList "--no-window","--port","8799" -PassThru
          Start-Sleep -Seconds 6
          $html = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/).Content
          if ($html -notmatch "CatalystFlow") { throw "app did not serve UI" }
          if (-not (Test-Path "$env:RUNNER_TEMP\cfdata\catalystflow.db")) { throw "no database created" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: CatalystFlow-windows
          path: CatalystFlow/dist/CatalystFlow
